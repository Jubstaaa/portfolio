name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:
        inputs:
            image_tag:
                description: 'Rollback: redeploy an existing image by its full 40-char commit SHA. Empty builds and deploys HEAD.'
                required: false
                default: ''
                type: string

permissions:
    contents: read

env:
    IMAGE: ghcr.io/jubstaaa/portfolio

jobs:
    ci:
        # Builds, smoke-tests and pushes the release image. The check job is not
        # re-run: the ruleset only merges up-to-date branches whose check passed.
        # A rollback skips this entirely: that SHA's image already exists.
        if: ${{ !inputs.image_tag }}
        uses: ./.github/workflows/ci.yml
        with:
            run-check: false
        permissions:
            contents: read
            packages: write

    deploy:
        needs: ci
        if: ${{ !cancelled() && (inputs.image_tag || needs.ci.result == 'success') }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        environment:
            name: Production
            url: https://ilkerbalcilar.com
        # Never cancel a deploy halfway through `compose up`.
        concurrency:
            group: production-deploy
            cancel-in-progress: false
        permissions:
            contents: read
            packages: write
        env:
            IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        steps:
            - name: Validate tag and confirm the image exists
              run: |
                  [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::image_tag must be a full 40-char commit SHA"; exit 1; }
                  docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" > /dev/null
            # The compose file comes from the repository, so the server never drifts from git.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  sparse-checkout: docker-compose.yml
                  sparse-checkout-cone-mode: false
            # For promoting :latest once the release is healthy.
            - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: Jubstaaa/deploy-actions/ssh@1d9b582d7547aa6f02352b655c0721dd5a88071f # v1.3.0
              with:
                  host: ${{ secrets.DO_HOST }}
                  user: ${{ secrets.DO_USER }}
                  key: ${{ secrets.DO_SSH_KEY }}
                  known-hosts: ${{ secrets.DO_KNOWN_HOSTS }}
            # Health-gated compose up with automatic rollback, then :latest moves to
            # the released SHA so it always means "what production runs".
            - uses: Jubstaaa/deploy-actions/compose@1d9b582d7547aa6f02352b655c0721dd5a88071f # v1.3.0
              with:
                  app-dir: /opt/portfolio
                  container: portfolio
                  image: ${{ env.IMAGE }}
                  tag: ${{ env.IMAGE_TAG }}
                  health-url: http://127.0.0.1:3002/
            # HTML is cached at the edge until purged: without this, visitors would
            # get the previous release's pages, which reference chunks the new
            # container no longer serves. A failed purge fails the job.
            - name: Purge Cloudflare cache
              env:
                  CF_PURGE_TOKEN: ${{ secrets.CF_PURGE_TOKEN }}
                  CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
              run: |
                  curl -fsS --retry 3 --retry-all-errors --retry-delay 5 \
                      -X POST "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/purge_cache" \
                      -H "Authorization: Bearer $CF_PURGE_TOKEN" \
                      --json '{"purge_everything":true}' \
                      | jq -e '.success' > /dev/null
