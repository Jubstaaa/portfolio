name: CI / Deploy

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest
            - run: bun install --frozen-lockfile
            - run: bun run lint
            - run: bun run typecheck

    build:
        needs: check
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            # Content images are served from Spaces + CDN. The repo stays the
            # source of truth, so every deploy pushes what changed. No --delete:
            # an image dropped from the repo may still be referenced by HTML that
            # is already deployed, or by a URL Google has indexed.
            - name: Sync content images to Spaces
              env:
                  AWS_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
                  AWS_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
                  AWS_DEFAULT_REGION: fra1
              run: |
                  aws s3 sync public/images "s3://${{ vars.SPACES_BUCKET }}/images" \
                    --endpoint-url https://fra1.digitaloceanspaces.com \
                    --acl public-read \
                    --cache-control "public, max-age=86400" \
                    --size-only --no-progress
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            # :latest is what the droplet runs; :sha stays behind as the rollback
            # target (`docker compose` pinned to it, or a manual docker run).
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: |
                      ghcr.io/jubstaaa/portfolio:latest
                      ghcr.io/jubstaaa/portfolio:${{ github.sha }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      NEXT_PUBLIC_CDN_BASE=${{ vars.NEXT_PUBLIC_CDN_BASE }}

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            packages: read
        steps:
            - uses: appleboy/ssh-action@v1
              with:
                  host: ${{ secrets.DO_HOST }}
                  username: ${{ secrets.DO_USER }}
                  key: ${{ secrets.DO_SSH_KEY }}
                  envs: GHCR_TOKEN,GHCR_USER
                  script: |
                      echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
                      cd /opt/portfolio
                      docker compose pull
                      docker compose up -d
                      docker image prune -f
              env:
                  GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  GHCR_USER: ${{ github.actor }}
