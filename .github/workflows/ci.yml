name: CI

on:
    pull_request:
        branches: [main]
    # deploy.yml reuses the image job to build and push the release image.
    workflow_call:
        inputs:
            run-check:
                description: 'Run the check job. deploy.yml skips it: the ruleset requires an up-to-date branch whose check passed, so main already holds a checked tree.'
                type: boolean
                default: true

permissions:
    contents: read

concurrency:
    group: ci-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
    IMAGE: ghcr.io/jubstaaa/portfolio

jobs:
    check:
        # A pull_request has no inputs (null == false in expressions), so test the
        # event explicitly. In a called workflow, event_name is the caller's event.
        if: ${{ github.event_name == 'pull_request' || inputs.run-check }}
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            # Before install, so it scans the lockfile and Dockerfile, not node_modules.
            - name: Trivy (vulnerabilities, secrets, misconfiguration)
              uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
              env:
                  TRIVY_INCLUDE_DEV_DEPS: true
              with:
                  scan-type: fs
                  scan-ref: .
                  scanners: vuln,secret,misconfig
                  severity: HIGH,CRITICAL
                  exit-code: '1'
                  cache-dir: ${{ runner.temp }}/trivy
            - uses: ./.github/actions/setup-bun
            - run: bun run format:check
            # Lint, the type check, knip and dependency-cruiser all resolve
            # #site/content and Next's route types, so generate them once first.
            - name: Generate content and route types
              run: bun run generate
            - run: bun run lint
            - name: Typecheck
              run: bunx tsc --noEmit
            - run: bun run test
            - run: bun run audit
            - name: Dead code and unused dependencies (knip)
              run: bun run knip
            - name: Duplication (jscpd)
              run: bun run jscpd
            - name: Module graph (dependency-cruiser)
              run: bun run depcruise
            - name: actionlint
              run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

    image:
        needs: check
        # Also runs when deploy.yml skipped the check, never after a failed one.
        if: ${{ !cancelled() && (needs.check.result == 'success' || needs.check.result == 'skipped') }}
        runs-on: ubuntu-latest
        timeout-minutes: 20
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Require the CDN base
              env:
                  CDN_BASE: ${{ vars.NEXT_PUBLIC_CDN_BASE }}
              run: test -n "$CDN_BASE" || { echo "::error::vars.NEXT_PUBLIC_CDN_BASE is empty"; exit 1; }
            - id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
              with:
                  images: ${{ env.IMAGE }}
                  # `candidate` is what docker-compose.yml runs below (IMAGE_TAG);
                  # the full commit SHA is what deploy and rollback address.
                  tags: |
                      type=raw,value=candidate
                      type=sha,format=long,prefix=
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - name: Build candidate
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  load: true
                  push: false
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  build-args: |
                      NEXT_PUBLIC_CDN_BASE=${{ vars.NEXT_PUBLIC_CDN_BASE }}
            # The production compose file itself, so CI exercises exactly the
            # hardening, healthcheck and limits the droplet runs.
            - name: Start candidate
              env:
                  IMAGE_TAG: candidate
                  IMAGE_CACHE_DIR: ${{ runner.temp }}/image-cache
              run: |
                  install -d -m 777 "$IMAGE_CACHE_DIR"
                  docker compose up -d --wait --wait-timeout 120 app
            - uses: ./.github/actions/setup-bun
            - name: Smoke test
              env:
                  CDN_BASE: ${{ vars.NEXT_PUBLIC_CDN_BASE }}
                  SMOKE_BASE_URL: http://127.0.0.1:3002
              run: bun run test:smoke
            - name: Candidate logs
              if: failure()
              env:
                  IMAGE_TAG: candidate
              run: docker compose logs app
            - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
              if: github.ref == 'refs/heads/main'
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            # Push the exact image that passed the smoke test, by SHA only: :latest
            # moves in deploy.yml after production reports healthy.
            - name: Push the SHA tag
              if: github.ref == 'refs/heads/main'
              run: docker push "$IMAGE:$GITHUB_SHA"
