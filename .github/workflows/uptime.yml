name: Uptime

on:
    schedule:
        # GitHub emails the owner when a scheduled run fails, which is the alert.
        - cron: '*/15 * * * *'
    workflow_dispatch:

permissions: {}

jobs:
    probe:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            # Retries ride out an edge blip or a deploy; only a sustained outage fails.
            - name: Home page serves the terminal
              run: |
                  curl -fsS --retry 4 --retry-all-errors --retry-delay 15 --max-time 20 \
                      https://ilkerbalcilar.com/ | grep -q 'data-terminal-static'
            - name: Feed is reachable
              run: |
                  curl -fsS -o /dev/null --retry 4 --retry-all-errors --retry-delay 15 --max-time 20 \
                      https://ilkerbalcilar.com/feed.xml
