version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ['*']
      commit-message:
          prefix: ci

    - package-ecosystem: docker
      directory: /
      schedule:
          interval: weekly
      # Production stays on the Active LTS line; odd/current Node majors are
      # not LTS, and an LTS move is a deliberate change (engines, @types/node).
      ignore:
          - dependency-name: node
            update-types: ['version-update:semver-major']
      commit-message:
          prefix: build

    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      cooldown:
          default-days: 5
      groups:
          dev-dependencies:
              dependency-type: development
              update-types: [minor, patch]
          prod-dependencies:
              dependency-type: production
              update-types: [minor, patch]
      ignore:
          # Must match the Node runtime major (see Dockerfile / engines).
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']
          # typescript-eslint peers on <6.1; revisit when it supports TS 7.
          - dependency-name: typescript
            update-types: ['version-update:semver-major']
          # msw 3 does not intercept fetch under Bun (requests reach the network);
          # 2.x does. Revisit with each Bun/msw release.
          - dependency-name: msw
            update-types: ['version-update:semver-major']
          # eslint-config-next's eslint-plugin-import/react still peer on ESLint 9.
          - dependency-name: eslint
            update-types: ['version-update:semver-major']
      commit-message:
          prefix: chore
          include: scope
