version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ['*']
      commit-message:
          prefix: ci

    - package-ecosystem: docker
      directory: /
      schedule:
          interval: weekly
      commit-message:
          prefix: build

    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      cooldown:
          default-days: 5
      groups:
          dev-dependencies:
              dependency-type: development
              update-types: [minor, patch]
          prod-dependencies:
              dependency-type: production
              update-types: [minor, patch]
      commit-message:
          prefix: chore
          include: scope
