version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
      groups:
          actions:
              patterns: ['*']
      commit-message:
          prefix: ci

    - package-ecosystem: docker
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
      # Production stays on the Active LTS line; odd/current Node majors are
      # not LTS, and an LTS move is a deliberate change (engines, @types/node).
      ignore:
          - dependency-name: node
            update-types: ['version-update:semver-major']
      commit-message:
          prefix: build

    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      cooldown:
          default-days: 5
      groups:
          dev-dependencies:
              dependency-type: development
              update-types: [minor, patch]
          prod-dependencies:
              dependency-type: production
              update-types: [minor, patch]
      ignore:
          # Must match the Node runtime major (see Dockerfile / engines).
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']
      commit-message:
          prefix: chore
          include: scope
