version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
      groups:
          actions:
              patterns: ['*']
      commit-message:
          prefix: ci

    - package-ecosystem: docker
      directory: /
      schedule:
          interval: weekly
      # Wait a week before proposing a new release: compromised versions are
      # usually caught and pulled within days.
      cooldown:
          default-days: 7
      # Only even majors become LTS; odd (Current) lines never do, so skip
      # them. Even majors are proposed as they ship.
      ignore:
          - dependency-name: node
            versions: ['25.x', '27.x', '29.x', '31.x']
      commit-message:
          prefix: build

    - package-ecosystem: bun
      directory: /
      schedule:
          interval: weekly
      open-pull-requests-limit: 5
      cooldown:
          default-days: 5
      groups:
          dev-dependencies:
              dependency-type: development
              update-types: [minor, patch]
          prod-dependencies:
              dependency-type: production
              update-types: [minor, patch]
          next:
              patterns: ['next', '@next/*', 'eslint-config-next']
          # react and react-dom refuse to run at different versions.
          react:
              patterns:
                  ['react', 'react-dom', '@types/react', '@types/react-dom']
          tailwind:
              patterns: ['tailwindcss', '@tailwindcss/*']
      ignore:
          # Odd Node majors are never LTS; the types follow the runtime line.
          - dependency-name: '@types/node'
            versions: ['25.x', '27.x', '29.x', '31.x']
          # `typescript` here is an alias for @typescript/typescript6 (the API
          # typescript-eslint and next build load); TS 7 itself updates through
          # @typescript/native, so Dependabot must not bump the alias key to 7.
          - dependency-name: typescript
            versions: ['>=7']
      commit-message:
          prefix: chore
          include: scope
