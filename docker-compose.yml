# Runtime stack on the droplet (/opt/portfolio). The app is published only on
# localhost:3002; the shared Caddy in /opt/proxy terminates TLS (Cloudflare origin
# cert) and reverse-proxies to it, alongside the other apps on this droplet.
# The image is pulled from GHCR by the deploy workflow.
services:
    app:
        # The deploy job sets IMAGE_TAG to the commit SHA it is releasing; :latest is
        # promoted only after a healthy deploy, so the fallback is the last good release.
        image: ghcr.io/jubstaaa/portfolio:${IMAGE_TAG:-latest}
        container_name: portfolio
        restart: unless-stopped
        mem_limit: 256m
        pids_limit: 128
        # The only runtime writes are Next's caches: optimized images (persisted below)
        # and the fetch cache behind /api/now-playing (ephemeral is fine).
        read_only: true
        tmpfs:
            - /tmp
            - /app/.next/cache/fetch-cache
        cap_drop:
            - ALL
        security_opt:
            - no-new-privileges:true
        logging:
            driver: json-file
            options:
                max-size: 10m
                max-file: '3'
        environment:
            # Keep V8's heap under the container limit so it collects garbage before
            # the cgroup OOM-kills the process.
            NODE_OPTIONS: --max-old-space-size=160
        # Docker does not restart an unhealthy container, and Beszel cannot alert per
        # container. The deploy job waits on this check (`compose up --wait`) and rolls
        # back when it fails; afterwards it only fills the Health column. wget here is
        # BusyBox: -T is the timeout, the GNU long options do not exist.
        healthcheck:
            test:
                [
                    'CMD-SHELL',
                    'wget -q -O /dev/null -T 3 http://127.0.0.1:3000/ || exit 1',
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 40s
        env_file: .env
        # No third party has Portainer access to this app. If that changes, set
        # PORTAINER_TEAMS in .env beside this file and uncomment the two lines
        # below: the permission is then reapplied on every recreate.
        #
        # Doing it from the Portainer UI instead does NOT work — the permission
        # is keyed to the container ID, and `docker compose up -d` replaces the
        # container, so access silently disappears on the next deploy. Leaving
        # the label out entirely means administrator-only, which is the default
        # we want here.
        #
        # labels:
        #     io.portainer.accesscontrol.teams: ${PORTAINER_TEAMS}
        ports:
            - '127.0.0.1:3002:3000'
        volumes:
            # Persist Next's optimized-image cache so it survives redeploys
            # (otherwise every deploy resets it and images go cold again).
            - /opt/portfolio/cache/images:/app/.next/cache/images
